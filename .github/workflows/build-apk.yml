name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "اسم التطبيق"
        required: true
        type: string
        default: "تطبيقي"

      package_name:
        description: "اسم الحزمة"
        required: true
        type: string
        default: "com.appmaker.myapp"

      version:
        description: "إصدار التطبيق"
        required: true
        type: string
        default: "1.0"

      version_code:
        description: "رقم إصدار التطبيق"
        required: true
        type: string
        default: "1"

      html:
        description: "كود HTML الكامل"
        required: true
        type: string
        default: "<!DOCTYPE html><html><body><h1>تطبيقي</h1></body></html>"

jobs:
  build:
    name: إنشاء APK
    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download H2APK
        run: |
          git clone --depth=1 https://github.com/HashShin/H2APK.git h2apk

      - name: Setup & Build H2APK
        working-directory: h2apk
        run: |
          chmod +x setup.sh
          ./setup.sh
          go build -o h2apk main.go

      - name: Run Server and Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.version_code }}
          HTML_CODE: ${{ inputs.html }}
        run: |
          # 1. تشغيل الخادم في الخلفية داخل نفس الخطوة
          cd h2apk
          PORT=8080 ./h2apk > server.log 2>&1 &
          SERVER_PID=$!
          cd ..
          
          echo "انتظار تشغيل الخادم..."
          sleep 5

          # 2. تجهيز بيانات الطلب
          python3 - <<'PY'
          import json, os

          data = {
              "app_name": os.environ["APP_NAME"],
              "package_name": os.environ["PACKAGE_NAME"],
              "version": os.environ["VERSION"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "html": os.environ["HTML_CODE"],
              "build_mode": "debug",
              "min_sdk": 23,
              "target_sdk": 35,
              "zoom_enabled": True,
              "pull_refresh": False,
              "splash_enabled": True,
              "splash_duration": 1200,
              "splash_use_icon": True,
              "transparent_nav": False,
              "allow_cleartext": False,
              "disable_copy_text": False,
              "hide_scrollbars": False
          }

          with open("build-request.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False)
          PY

          # 3. إرسال الطلب
          RESPONSE=$(curl -sS -X POST \
            http://localhost:8080/api/build \
            -H "Content-Type: application/json" \
            --data-binary @build-request.json)

          BUILD_ID=$(echo "$RESPONSE" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("build_id", ""))')

          if [ -z "$BUILD_ID" ]; then
            echo "فشل إرسال طلب البناء"
            cat h2apk/server.log
            exit 1
          fi

          # 4. انتظار تجهيز الـ APK
          APK_NAME=""
          for i in {1..120}; do
            RESPONSE=$(curl -sS "http://localhost:8080/api/status/$BUILD_ID")
            APK_NAME=$(echo "$RESPONSE" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("apk_name", ""))')

            if [ -n "$APK_NAME" ]; then
              echo "تم إنشاء APK بنجاح: $APK_NAME"
              echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
              break
            fi

            ERROR=$(echo "$RESPONSE" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("error", ""))')
            if [ -n "$ERROR" ]; then
              echo "فشل البناء: $ERROR"
              cat h2apk/server.log
              exit 1
            fi

            sleep 3
          done

          if [ -z "$APK_NAME" ]; then
            echo "انتهى وقت انتظار البناء"
            cat h2apk/server.log
            exit 1
          fi

      - name: Verify APK
        run: |
          APK_PATH="h2apk/output/${{ env.APK_NAME }}"
          if [ ! -f "$APK_PATH" ]; then
            echo "لم يتم العثور على ملف APK"
            ls -la h2apk/output || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-APK
          path: h2apk/output/${{ env.APK_NAME }}
          if-no-files-found: error
